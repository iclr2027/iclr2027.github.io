<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Auditing Attribution by Conditioning Provenance in Any-Stem Music Generation</title>
<style>
:root{--bg:#F7F9FA;--card:#FFFFFF;--ink:#1A2430;--muted:#5A6B7A;--hair:#E1E7EC;
  --acc:#D55E00;--acc2:#0072B2;--good:#0B7A4B;--bad:#c0392b;--soft:#FFF4EC;--vio:#6A4CB0;--teal:#0E7C86;--navh:50px;
  /* stem palette = the hues of paper Figure 1 (template/fig1_src.svg): stem 1 orange, 2 green, 3 violet,
     context blue. --sN is the figure pill stroke (row accent, waveform progress), --sNt the figure pill
     text (labels, play glyph). s3..s5 continue the same recipe at the farthest remaining hues. */
  --s0:#E8833A;--s1:#3A9E83;--s2:#8A63C9;--s3:#B3CA40;--s4:#CA406C;--s5:#40CA69;--ctxc:#3F7FC4;
  --s0t:#B3541E;--s1t:#175C4A;--s2t:#4A2F78;--s3t:#798B22;--s4t:#8B2243;--s5t:#228B41;--ctxt:#1F5FA8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10161D;--card:#171F28;
  --ink:#E8ECF0;--muted:#94A3B0;--hair:#26303B;--acc:#FF8B42;--acc2:#57A8E8;--good:#3FBF87;--bad:#e05545;--soft:#2A1F16;--vio:#A98CE8;--teal:#4CC3CD;
  --s0:#FF8B42;--s1:#4CC3A0;--s2:#A98CE8;--s3:#CEE65B;--s4:#E65B87;--s5:#5BE685;--ctxc:#57A8E8;
  --s0t:#FFB27A;--s1t:#7FD8B8;--s2t:#C4B0F0;--s3t:#DEEE8D;--s4t:#EE8DAC;--s5t:#8DEEAA;--ctxt:#8CC0F0}}
:root[data-theme="dark"]{--bg:#10161D;--card:#171F28;--ink:#E8ECF0;--muted:#94A3B0;--hair:#26303B;
  --acc:#FF8B42;--acc2:#57A8E8;--good:#3FBF87;--bad:#e05545;--soft:#2A1F16;--vio:#A98CE8;--teal:#4CC3CD;
  --s0:#FF8B42;--s1:#4CC3A0;--s2:#A98CE8;--s3:#CEE65B;--s4:#E65B87;--s5:#5BE685;--ctxc:#57A8E8;
  --s0t:#FFB27A;--s1t:#7FD8B8;--s2t:#C4B0F0;--s3t:#DEEE8D;--s4t:#EE8DAC;--s5t:#8DEEAA;--ctxt:#8CC0F0}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  padding:calc(var(--navh) + 20px) 16px 80px;max-width:980px;margin:0 auto}
h1{font-size:22px;line-height:1.3;margin-bottom:6px}
h2{font-size:18px;margin:0 0 6px}
p{margin:5px 0}
a{color:var(--acc2)}
.muted{color:var(--muted);font-size:13px}
kbd{font:10.5px/1.3 ui-monospace,Menlo,monospace;border:1px solid var(--hair);border-bottom-width:2px;
  border-radius:4px;padding:0 4px;color:var(--muted);margin-right:3px;vertical-align:1px}
#nav{position:fixed;top:0;left:0;right:0;height:var(--navh);z-index:50;background:var(--card);border-bottom:1px solid var(--hair);
  display:flex;align-items:center;gap:4px;padding:0 12px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav .brand{font-weight:700;font-size:13.5px;color:var(--ink);text-decoration:none;margin-right:8px}
#nav a.lnk{font-size:13px;color:var(--muted);text-decoration:none;padding:5px 9px;border-radius:8px}
#nav a.lnk:hover{color:var(--ink);background:var(--soft)}
#nav a.lnk.on{color:var(--acc);font-weight:650}
#nav .sp{flex:1 1 auto}
#theme{font-size:12px;padding:3px 10px;border:1px solid var(--hair);border-radius:12px;background:transparent;color:var(--muted);cursor:pointer}
header{margin-bottom:6px}
header .authors{font-size:14px;color:var(--ink);margin:2px 0}
section{scroll-margin-top:calc(var(--navh) + 12px);margin:26px 0 0;padding-top:14px;border-top:1px solid var(--hair)}
section:first-of-type{border-top:0;padding-top:0}
.shead{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.shead h2{margin:0}
.fchip{flex:0 0 auto;font-size:12px;font-weight:700;line-height:20px;letter-spacing:.04em;text-transform:uppercase;
  color:#fff;background:var(--acc);border-radius:8px;padding:0 9px;white-space:nowrap}
.intro{max-width:860px}
.intro p{margin:4px 0}
/* paper floats: collapsible block, one per float of the paper */
details.pfloat{background:var(--card);border:1px solid var(--hair);border-radius:12px;margin:10px 0}
details.pfloat>summary{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;list-style:none;
  border-bottom:1px solid transparent;border-radius:12px}
details.pfloat>summary::-webkit-details-marker{display:none}
details.pfloat[open]>summary{border-bottom-color:var(--hair);border-radius:12px 12px 0 0}
details.pfloat>summary:focus-visible{outline:2px solid var(--acc2);outline-offset:-2px}
.pfloat .cv{flex:0 0 auto;width:0;height:0;border:5px solid transparent;border-left:7px solid var(--muted);border-right:0}
details.pfloat[open] .cv{transform:rotate(90deg)}
.fchip.sm{font-size:11px;line-height:18px;padding:0 7px}
.pfloat .ft{font-size:13.5px;font-weight:650;color:var(--ink);min-width:0}
.pfloat .pt{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.pbody{padding:9px 12px 11px;overflow-x:auto}
.pbody>svg{display:block;width:100%;height:auto;max-height:520px;margin:0 auto;font-family:inherit}
.pcap{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
/* case coverage of the memorization audit: every verdict case, its count, its examples.
   The cases with no instance are a result of the audit, so their rows are drawn, not dropped. */
.ccov{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:10px 12px 12px;margin:10px 0}
.ccov .ct{font-size:14px;font-weight:700;color:var(--ink)}
.ccov .csub{font-size:12.5px;color:var(--muted);margin:2px 0 7px;line-height:1.4}
table.ctab{border-collapse:collapse;width:100%;font-size:12.5px;color:var(--ink)}
table.ctab th{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:0 10px 4px 0;border-bottom:1px solid var(--hair);white-space:nowrap}
table.ctab td{padding:5px 10px 5px 0;border-bottom:1px dotted var(--hair);vertical-align:top}
table.ctab th.n,table.ctab td.n{text-align:right;padding-right:14px}
table.ctab td.n{font:700 13px/18px ui-monospace,Menlo,monospace;white-space:nowrap}
table.ctab .cs{font-weight:700;white-space:nowrap}
table.ctab .cn{display:block;font-size:11.5px;font-weight:400;color:var(--muted);line-height:1.35;white-space:normal}
table.ctab tr.z td{background:var(--soft)}
table.ctab .nf{font-weight:700;color:var(--ink)}
a.xl{display:inline-block;font:700 11.5px/18px ui-monospace,Menlo,monospace;color:var(--acc2);text-decoration:none;
  border:1px solid var(--hair);border-radius:7px;padding:0 7px;margin:0 4px 3px 0;background:var(--bg)}
a.xl:hover,a.xl:focus-visible{border-color:var(--acc);color:var(--acc)}
/* fallback look for a paper table; template/ptab.css (injected below) may override it */
.pbody table:not(.ptab){border-collapse:collapse;font-size:12.5px;margin:0 auto;color:var(--ink)}
.pbody table:not(.ptab) th,.pbody table:not(.ptab) td{padding:3px 8px;text-align:right;white-space:nowrap}
.pbody table:not(.ptab) th{font-weight:650;color:var(--muted)}
.pbody table:not(.ptab) td:first-child,.pbody table:not(.ptab) th:first-child{text-align:left}
/* example switcher: one card body per section, chips carry the paper identifiers */
/* two-level switcher: the a / b / c blocks of paper Table 2, then the examples inside the active block */
.blks{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.blk{display:inline-flex;align-items:baseline;gap:7px;font-family:inherit;font-size:12.5px;line-height:26px;
  padding:0 11px;border:1px solid var(--hair);border-radius:9px;background:var(--card);color:var(--muted);cursor:pointer}
.blk .bk{font:700 13px/26px ui-monospace,Menlo,monospace;text-transform:lowercase;color:var(--ink)}
.blk:hover{border-color:var(--acc)}
.blk.on{border-color:var(--acc);background:var(--soft)}
.blk.on .bk,.blk.on .bt{color:var(--acc)}
.chip[hidden]{display:none}
/* what the conditioning swap did to the measurements the paper reports (MFCC timbre, chroma harmony) */
.mvs{margin:7px 0 2px;border:1px solid var(--hair);border-radius:10px;overflow:hidden}
table.mtab{border-collapse:collapse;width:100%;font-size:12.5px;color:var(--ink)}
table.mtab th{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:5px 10px;background:var(--bg);border-bottom:1px solid var(--hair);white-space:nowrap}
table.mtab th.n,table.mtab td.n{text-align:right;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
table.mtab td{padding:5px 10px;border-bottom:1px dotted var(--hair);vertical-align:baseline}
table.mtab tr:last-child td{border-bottom:0}
table.mtab .mm{display:inline-block;font:700 9.5px/14px ui-monospace,Menlo,monospace;letter-spacing:.04em;
  border:1px solid var(--hair);border-radius:6px;padding:0 4px;margin-right:6px;color:var(--muted);vertical-align:1px}
table.mtab .sysn{color:var(--muted);font-size:11.5px}
table.mtab .ar{color:var(--muted);padding:0 3px}
table.mtab .dl{font-weight:700}
table.mtab .good{color:var(--good)}
table.mtab .meh{color:var(--muted)}
.mvs .mleg{font-size:11.5px;color:var(--muted);padding:6px 10px 7px;line-height:1.4;border-top:1px solid var(--hair)}
.sws{display:flex;flex-wrap:wrap;gap:7px 6px;align-items:center;margin:14px 0 0}
.sws .swg{flex:0 0 100%;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  margin-top:5px;padding-top:6px;border-top:1px solid var(--hair)}
.sws .swg.first{margin-top:0;padding-top:0;border-top:0}
.chip{display:inline-flex;align-items:baseline;gap:6px;font-family:inherit;font-size:12px;line-height:22px;padding:0 9px;
  border:1px solid var(--hair);border-radius:11px;background:var(--card);color:var(--muted);cursor:pointer;
  max-width:100%;white-space:nowrap}
.chip .cid{font:700 11.5px/22px ui-monospace,Menlo,monospace;letter-spacing:.02em;color:var(--ink)}
.chip .chint{font-size:11.5px;line-height:22px}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on .cid{color:#fff}
.chip .ccase{flex:0 0 auto;font-size:11px;font-weight:700;line-height:17px;color:var(--ink);background:var(--bg);
  border:1px solid var(--hair);border-radius:6px;padding:0 6px;white-space:nowrap}
.chip.on .ccase{color:#fff;background:transparent;border-color:#fff}
.chip:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.exhost{min-height:64px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 16px;margin:8px 0 0}
.card:focus-within{border-color:var(--acc)}
.head{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
.head .i{font-weight:700;font-size:15.5px}
.head .s{color:var(--muted);font-size:12.5px}
.head .fid{flex:0 0 auto;font:700 11.5px/19px ui-monospace,Menlo,monospace;letter-spacing:.02em;color:var(--acc);
  background:var(--soft);border:1px solid var(--acc);border-radius:7px;padding:0 7px}
/* verdict case of a memorization example (Figure 2 / Table 3): shown on the card head and on every chip */
.head .ccase{flex:0 0 auto;font-size:12px;font-weight:700;line-height:19px;color:var(--ink);
  border:1px solid var(--ink);border-radius:7px;padding:0 8px;white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 2px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:20px;padding:0 9px;border-radius:11px;
  background:var(--soft);border:1px solid var(--hair);color:var(--ink)}
.badge .bv{font-weight:700;font-family:ui-monospace,Menlo,monospace;color:var(--acc)}
/* 4+ badges (e.g. the per-example detector scores) read better as a key/value list than as pills */
.badges.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;margin:6px 0 3px;max-width:720px}
.badges.kv .badge{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:1px 1px 2px;
  background:transparent;border:0;border-bottom:1px dotted var(--hair);border-radius:0;line-height:18px}
.badges.kv .badge .bl{color:var(--muted);white-space:normal;min-width:0}
.badges.kv .badge .bv{flex:0 0 auto}
/* six-detector score strip: the same six detectors as paper Figure 3, for one example.
   A cell that fired is marked three ways, so colour alone never carries it: filled background + thicker
   accent border, a bullet before the detector name, and a bold value. */
.dstrip{margin:7px 0 3px}
.dslab{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.dslab span{font-weight:400;text-transform:none;letter-spacing:0;font-size:11.5px}
.dgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.dcell{border:1px solid var(--hair);border-radius:9px;background:var(--bg);padding:3px 7px 4px;min-width:0}
.dcell .dn{display:block;font-size:10.5px;line-height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcell .dm{display:inline-block;width:10px;font-size:9px;line-height:14px;vertical-align:1px}
.dcell .dv{display:block;font:500 13.5px/17px ui-monospace,Menlo,monospace;color:var(--ink)}
.dcell .dc{display:block;font:11px/14px ui-monospace,Menlo,monospace;color:var(--muted);white-space:nowrap}
.dcell.hit{border-color:var(--acc);border-width:1.5px;background:var(--soft);padding:2.5px 6.5px 3.5px}
.dcell.hit .dn,.dcell.hit .dv{color:var(--acc);font-weight:800}
.dleg{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
.dleg b{color:var(--ink);font-weight:700}
.note{font-size:13px;color:var(--muted);margin:4px 0 4px}
.group{margin-top:8px;padding-top:6px;border-top:1px dashed var(--hair)}
.group:first-of-type{border-top:0}
.glab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin-bottom:1px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px}
.row{display:flex;gap:7px;align-items:center;padding:2px 0;min-width:0;--sc:var(--acc);--sct:var(--acc)}
.play{width:28px;height:28px;min-width:28px;border-radius:50%;border:1.5px solid var(--sc);
  background:transparent;color:var(--sct);font-size:10px;cursor:pointer;padding:0}
.play:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.row.playing .play{background:var(--sct);border-color:var(--sct);color:var(--card)}
.row.err .play{border-color:var(--bad);color:var(--bad);opacity:.6}
.rlab{min-width:160px;max-width:160px;font-size:12px;color:var(--ink);line-height:1.2}
.rlab .dur{color:var(--muted);white-space:nowrap}
.sys{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:14px;
  padding:0 5px;border-radius:8px;border:1px solid var(--muted);color:var(--muted);margin:0 4px 1px 0;vertical-align:1px}
.sys.ctx{color:var(--acc2);border-color:var(--acc2)}
.sys.prompt{color:var(--acc);border-color:var(--acc)}
.sys.ours{background:var(--good);border-color:var(--good);color:#fff}
.sys.ace{background:var(--vio);border-color:var(--vio);color:#fff}
.sys.real{color:var(--ink);border-color:var(--ink)}
.sys.mix{color:var(--teal);border-color:var(--teal)}
.sys.hit{background:var(--bad);border-color:var(--bad);color:#fff}
.sys.regen{color:var(--good);border-color:var(--good)}
.sys.ref{color:var(--muted);border-color:var(--hair);background:var(--soft)}
canvas.wave{flex:1 1 0;width:0;min-width:0;height:32px;cursor:pointer;display:block}
/* figure-shaped player (Figure 1 cards): narrow conditioning column, wide generated column */
.genfig{display:grid;grid-template-columns:minmax(0,30fr) 34px minmax(0,70fr);gap:0;margin-top:8px;align-items:stretch}
.gpanel{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--hair);border-radius:12px;padding:8px 10px;min-width:0}
.ptitle{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;height:22px;line-height:22px;text-align:center}
.pspace{flex:1 1 auto;min-height:26px;position:relative}
.gpanel.right .pspace::before{content:'';position:absolute;left:50%;top:4px;bottom:9px;border-left:2px solid var(--muted)}
.gpanel.right .pspace::after{content:'';position:absolute;left:50%;bottom:4px;margin-left:-4px;border:4px solid transparent;border-top:6px solid var(--muted);border-bottom:0}
.row.g{height:46px;gap:6px;border-radius:9px;padding:0 6px;background:var(--card);border:1px solid var(--hair);border-left:4px solid var(--sc);margin:3px 0}
.row.g .rlab{min-width:0;max-width:none;flex:0 0 auto;width:82px;font-weight:600;font-size:12px;color:var(--sct);white-space:normal}
.row.g .rlab .dur{display:block;font-weight:400;font-size:10.5px;line-height:1.15}
.row.g canvas.wave{height:30px}
.row.g.mix{border-left-color:var(--muted)}
.gpanel.left .row.g{height:auto;min-height:46px;padding:3px 6px}
.gpanel.left .row.g .rlab{width:74px;font-size:11.5px}
.sw{display:inline-flex;border:1px solid var(--hair);border-radius:7px;overflow:hidden;flex:0 0 auto}
.sw button{font-size:10.5px;line-height:20px;padding:0 6px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-left:1px solid var(--hair)}
.sw button:first-child{border-left:0}
.sw button.on{background:var(--sct);color:var(--card);font-weight:700}
.sw button:focus-visible{outline:2px solid var(--acc2);outline-offset:-2px}
/* bracket between the two columns (the generator box is deliberately not drawn) */
.gmid{display:flex;align-items:center;justify-content:center;padding:24px 2px}
.gbr{position:relative;flex:1 1 auto;align-self:stretch;min-height:44px}
.gbr::before{content:'';position:absolute;left:3px;top:6%;bottom:6%;border-left:2px solid var(--hair)}
.gbr .h{position:absolute;left:3px;right:10px;top:50%;height:2px;background:var(--muted)}
.gbr .h::after{content:'';position:absolute;right:-10px;top:-5px;border:6px solid transparent;border-left:10px solid var(--muted);border-right:0}
footer{margin-top:36px;padding-top:12px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--muted)}
#loadMsg{margin:20px 0}
@media (max-width:760px){
  body{padding-left:10px;padding-right:10px;font-size:14.5px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .rlab{min-width:126px;max-width:126px;font-size:11.5px}
  .pbody{padding:8px}
  .genfig{grid-template-columns:minmax(0,1fr)}
  .gmid{display:none}
  .gpanel .pspace{min-height:6px}
  .gpanel.right .pspace::before,.gpanel.right .pspace::after{display:none}
  .row.g .rlab{width:76px}
  .sws{gap:6px 5px}
  .chip{padding:0 8px;white-space:normal}
  .badges.kv{grid-template-columns:minmax(0,1fr);max-width:none}
  .dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}   /* two rows of three */
  .dcell .dv{font-size:13px}
  table.ctab .cs{white-space:normal}
}
/* Paper floats on the demo page: LaTeX tables rendered as HTML (.ptab) and the
   six-panel detector figure (.fig3, two SVG variants switched by theme).
   Tokens mirror template/index.html; memOr/memBl are the paper's memorization colors
   (RGB 213,94,0 and 0,114,178 in the light theme). ASCII only. */
:root{--memor:#D55E00;--membl:#0072B2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--memor:#FF8B42;--membl:#57A8E8}}
:root[data-theme="dark"]{--memor:#FF8B42;--membl:#57A8E8}
:root[data-theme="light"]{--memor:#D55E00;--membl:#0072B2}

/* optional scroll wrapper for narrow screens: <div class="ptw"><table class="ptab">... */
.ptw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ptab{border-collapse:collapse;width:100%;margin:6px 0 2px;
  font:12.5px/1.35 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
table.ptab caption{caption-side:top;text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);
  letter-spacing:.02em;padding:0 0 5px}

  table.ptab tbody tr.ind th:first-child{padding-left:12px}}

/* six-panel detector figure: light and dark SVG, only one is displayed */

  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
</style>

<body>
<nav id="nav"><a class="brand" href="#top" id="brand">Audio examples</a><span id="navLinks"></span><span class="sp"></span><button id="theme" type="button" title="Color theme">Theme: auto</button></nav>

<header id="top">
<h1 id="pageTitle"></h1>
<p class="authors" id="authors"></p>
<p class="muted sub" id="subtitle"></p>
<div class="intro" id="overview" style="margin-top:8px"></div>
<p class="muted" id="keysNote" style="font-size:12px;margin-top:4px"><kbd>Space</kbd> stop &nbsp; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> seek 1 s, or switch example while an example chip has focus &nbsp;&middot;&nbsp; click a waveform to play from there. Headphones recommended.</p>
</header>

<main id="main"><p id="loadMsg" class="muted">Loading&hellip;</p></main>

<footer id="foot"></footer>

<script>
'use strict';
// -- state and constants --
let D = null, actx = null, current = null;
const bufs = new Map();          // audio url -> decoded buffer; kept across example switches
const WAVES = [];                // [canvas, peaks] of every wired row (detached ones are skipped)
let WCOL = null;                 // while a card body is being built: collect its waves
const PLAY = '\u25B6', PAUSE = '\u275A\u275A';
const SYS = {ctx: 'Context', prompt: 'Prompt', ours: 'Ours', ace: 'ACE', real: 'Real', mix: 'Mix', hit: 'Training match', regen: 'Regenerated', ref: 'Reference'};
const SWL = {ours: 'Ours', ace: 'ACE', real: 'Real'};
// Section id -> inline figure, used only if data.json carries no float blocks for the section.
// Paper Figure 1 lives in the generation section, paper Figure 2 (verdict tree) in the memorization section.
// Both are inlined by demo_build.py (D.figures.fig1_svg / D.figures.tree_svg) from the paper's own files.
const FIG_AT = {gen: 'fig1', mem: 'tree'};
// Section id -> card layout: figure = the figure-shaped player, list = the compact row list.
const LAYOUT_AT = {gen: 'figure'};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const slug = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const titleize = s => String(s == null ? '' : s).split('_').filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

// -- theme --
const THEME_KEY = 'demo_theme';
const THEMES = ['auto', 'light', 'dark'];
const store = {get(){ try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } },
               set(v){ try { localStorage.setItem(THEME_KEY, v); } catch (e) {} }};
function applyTheme(t){
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  store.set(t);
  document.getElementById('theme').textContent = 'Theme: ' + t;
  redrawAll();
}
document.getElementById('theme').onclick = () => {
  const cur = store.get() || 'auto';
  applyTheme(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]);
};
applyTheme(THEMES.includes(store.get()) ? store.get() : 'auto');

// -- audio engine (from the listening-test page) --
function redrawAll(){ WAVES.forEach(w => { if (!current || current.args[2] !== w[0]) drawWave(w[0], w[1]); }); }
window.addEventListener('resize', redrawAll);
function stopAll(){ if (current){ try { current.stop(); } catch (e) {} current = null; } }
function ensureCtx(){
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
async function getBuf(url){
  if (bufs.has(url)) return bufs.get(url);
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const b = await actx.decodeAudioData(await r.arrayBuffer());
  bufs.set(url, b);
  return b;
}
function drawWave(cv, pkB64, prog){
  const raw = atob(pkB64);
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  if (cv.width !== W * dpr){ cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const cs = getComputedStyle(document.documentElement);
  const cRow = getComputedStyle(cv).getPropertyValue('--sc').trim();
  const cAcc = cRow || cs.getPropertyValue('--acc').trim(), cHair = cs.getPropertyValue('--hair').trim(),
        cMut = cs.getPropertyValue('--muted').trim();
  const n = raw.length, bw = W / n;
  g.fillStyle = cHair; g.fillRect(0, H / 2 - .5, W, 1);
  for (let i = 0; i < n; i++){
    const v = raw.charCodeAt(i) / 255, bh = Math.max(1, v * (H - 4));
    g.fillStyle = (prog !== undefined && i / n <= prog) ? cAcc : cMut;
    g.fillRect(i * bw, (H - bh) / 2, Math.max(.8, bw - .6), bh);
  }
}
async function playRow(url, rowEl, cv, pk, offset){
  ensureCtx();
  if (current && current.url === url && offset === undefined){ stopAll(); return; }
  stopAll();
  rowEl.classList.add('playing');
  const btn = rowEl.querySelector('.play');
  btn.textContent = PAUSE;
  let stopped = false, raf = 0, src = null;
  const cur = { url, args: [url, rowEl, cv, pk], stop(){ stopped = true; cancelAnimationFrame(raf);
      if (src){ try { src.stop(); } catch (e) {} }
      rowEl.classList.remove('playing'); btn.textContent = PLAY; drawWave(cv, pk); } };
  current = cur;
  let buf;
  try { buf = await getBuf(url); } catch (e) { rowEl.classList.add('err'); btn.title = 'Could not load ' + url; if (current === cur) stopAll(); return; }
  if (stopped || current !== cur) return;
  src = actx.createBufferSource();
  src.buffer = buf; src.connect(actx.destination);
  const off = offset || 0, t0 = actx.currentTime - off;
  cur.pos = () => actx.currentTime - t0; cur.dur = buf.duration;
  src.start(0, off);
  src.onended = () => { if (current === cur) stopAll(); };
  (function tick(){
    if (stopped || current !== cur) return;
    const p = (actx.currentTime - t0) / buf.duration;
    drawWave(cv, pk, p);
    raf = requestAnimationFrame(tick);
  })();
}
// Wire a play button and a waveform canvas to a mutable clip; sel() returns the current [name, peaks, dur].
function wireRow(div, sel){
  const cv = div.querySelector('canvas'), btn = div.querySelector('.play');
  const url = () => 'audio/' + sel()[0] + '.mp3';
  btn.onclick = () => playRow(url(), div, cv, sel()[1], undefined);
  cv.onclick = async ev => {
    ensureCtx();
    let buf; try { buf = await getBuf(url()); } catch (e) { div.classList.add('err'); return; }
    const r = ev.target.getBoundingClientRect();
    playRow(url(), div, cv, sel()[1], (ev.clientX - r.left) / r.width * buf.duration);
  };
  const w = [cv, sel()[1]];
  WAVES.push(w);
  if (WCOL) WCOL.push(w);
  requestAnimationFrame(() => drawWave(cv, w[1]));
  return w;
}
function audioRow(row){
  const [name, pk, dur] = row.clip;
  const sys = /^[a-z]+$/.test(row.sys || '') ? row.sys : 'ref';
  const div = document.createElement('div');
  div.className = 'row'; div.dataset.sys = sys;
  div.innerHTML = `<button class="play" type="button" title="play / stop" aria-label="play ${esc(row.label)}">${PLAY}</button>` +
    `<div class="rlab"><span class="sys ${sys}">${esc(SYS[sys] || sys)}</span>${esc(row.label)} <span class="dur">${esc(dur)} s</span></div>` +
    `<canvas class="wave" title="play from here"></canvas>`;
  wireRow(div, () => row.clip);
  return div;
}
// A figure-style row: colored, optional system switch selecting among {ours, ace, real} clips.
function genRow(label, paint, opts, extraClass, cap){
  const div = document.createElement('div');
  div.className = 'row g' + (extraClass ? ' ' + extraClass : '');
  div.style.setProperty('--sc', paint.acc); div.style.setProperty('--sct', paint.ink);
  const keys = Object.keys(opts);
  let curKey = keys[0];
  const clip = () => opts[curKey].clip;
  const dur = () => (cap ? esc(cap) + ' &middot; ' : '') + esc(clip()[2]) + ' s';
  div.innerHTML = `<button class="play" type="button" title="play / stop" aria-label="play ${esc(label)}">${PLAY}</button>` +
    `<div class="rlab">${esc(label)}<span class="dur">${dur()}</span></div>` +
    `<canvas class="wave" title="play from here"></canvas>` +
    (keys.length > 1 ? '<div class="sw" role="group" aria-label="system">' +
      keys.map(k => `<button type="button" data-k="${esc(k)}" class="${k === curKey ? 'on' : ''}">${esc(SWL[k] || k)}</button>`).join('') + '</div>' : '');
  const w = wireRow(div, clip);
  div.querySelectorAll('.sw button').forEach(b => b.onclick = () => {
    if (b.dataset.k === curKey) return;
    // Switching systems while this row plays keeps it playing, from the same playhead: the clips share
    // the section's time axis, so ours / ACE / real can be compared without restarting.
    let at = null;
    if (current && current.args[1] === div){ at = current.pos ? current.pos() : 0; stopAll(); }
    curKey = b.dataset.k;
    div.querySelectorAll('.sw button').forEach(x => x.classList.toggle('on', x === b));
    div.querySelector('.dur').innerHTML = dur();
    w[1] = clip()[1]; drawWave(w[0], w[1]);
    if (at !== null){
      const len = Number(clip()[2]) || 0;
      playRow('audio/' + clip()[0] + '.mp3', div, w[0], w[1], Math.max(0, Math.min(at, Math.max(0, len - 0.05))));
    }
  });
  return div;
}
// Paint of stem i: the accent is the Figure 1 pill stroke, the ink its pill text (see the token block).
const stemPaint = i => ({acc: `var(--s${i % 6})`, ink: `var(--s${i % 6}t)`});
// Context keeps the figure's blue; the mix row is neutral, as the figure paints "One mix" in ink.
const CTX_PAINT = {acc: 'var(--ctxc)', ink: 'var(--ctxt)'}, MIX_PAINT = {acc: 'var(--ink)', ink: 'var(--ink)'};
// -- inline figures (theme-aware via CSS variables) --
function wavePath(x, y, n, amp){
  let d = `M${x} ${y}`;
  for (let i = 0; i < n; i++) d += ` q5 ${-amp} 10 0 q5 ${amp} 10 0`;
  return d;
}
function figConcept(){
  const P = ['Prompt 1', 'Prompt 2', 'Prompt N'], S = ['Stem 1', 'Stem 2', 'Stem N'];
  const ys = [64, 104, 158];
  const pill = (x, y, w, p, txt) => `<rect x="${x}" y="${y}" width="${w}" height="30" rx="7" fill="${p.acc}" fill-opacity=".12" stroke="${p.acc}" stroke-width="1.3"/>` +
    `<path d="${wavePath(x + 12, y + 15, 3, 7)}" fill="none" stroke="${p.acc}" stroke-width="1.6" stroke-linecap="round"/>` +
    `<text x="${x + w - 12}" y="${y + 15}" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="600" fill="${p.ink}">${txt}</text>`;
  const dots = (x, y) => `<circle cx="${x}" cy="${y - 8}" r="1.8" fill="var(--muted)"/><circle cx="${x}" cy="${y}" r="1.8" fill="var(--muted)"/><circle cx="${x}" cy="${y + 8}" r="1.8" fill="var(--muted)"/>`;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Concept figure: registered prompts and context go into the any-stem generator, which produces one stem per prompt; the generated stems and the context sum to one mix">`;
  s += `<defs><marker id="carr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="var(--muted)"/></marker></defs>`;
  s += `<g font-family="inherit">`;
  // left panel
  s += `<rect x="16" y="14" width="260" height="262" rx="12" fill="var(--bg)" stroke="var(--hair)"/>`;
  s += `<text x="146" y="36" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="var(--ink)">Registered audio</text>`;
  P.forEach((t, i) => { s += pill(40, ys[i], 212, stemPaint(i), t); });
  s += dots(146, 141);
  s += `<rect x="40" y="222" width="212" height="34" rx="7" fill="var(--ctxc)" fill-opacity=".12" stroke="var(--ctxc)" stroke-width="1.3"/>`;
  s += `<path d="${wavePath(52, 239, 6, 9)}" fill="none" stroke="var(--ctxc)" stroke-width="1.6" stroke-linecap="round"/>`;
  s += `<text x="240" y="239" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="600" fill="var(--ctxt)">Context</text>`;
  // center block
  s += `<line x1="276" y1="126" x2="318" y2="126" stroke="var(--muted)" stroke-width="2" marker-end="url(#carr)"/>`;
  s += `<rect x="322" y="76" width="140" height="100" rx="12" fill="var(--ink)"/>`;
  s += `<text x="392" y="116" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="var(--bg)">Any-stem</text>`;
  s += `<text x="392" y="138" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="var(--bg)">generator</text>`;
  s += `<line x1="462" y1="126" x2="504" y2="126" stroke="var(--muted)" stroke-width="2" marker-end="url(#carr)"/>`;
  // right panel
  s += `<rect x="508" y="14" width="236" height="196" rx="12" fill="var(--bg)" stroke="var(--hair)"/>`;
  s += `<text x="626" y="36" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="var(--ink)">Generated stems</text>`;
  S.forEach((t, i) => { s += pill(528, ys[i], 196, stemPaint(i), t); });
  s += dots(626, 141);
  // sum node and one mix
  s += `<line x1="626" y1="210" x2="626" y2="228" stroke="var(--muted)" stroke-width="2" marker-end="url(#carr)"/>`;
  s += `<line x1="252" y1="239" x2="608" y2="239" stroke="var(--muted)" stroke-width="2" marker-end="url(#carr)"/>`;
  s += `<circle cx="626" cy="239" r="13" fill="var(--card)" stroke="var(--muted)" stroke-width="1.6"/>`;
  s += `<text x="626" y="239" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="var(--muted)">+</text>`;
  s += `<line x1="639" y1="239" x2="662" y2="239" stroke="var(--muted)" stroke-width="2" marker-end="url(#carr)"/>`;
  s += `<text x="668" y="239" dominant-baseline="central" font-size="14" font-weight="700" fill="var(--ink)">One mix</text>`;
  s += `</g></svg>`;
  return s;
}
// Inline figures shipped in data.json. Figure 1 falls back to the schematic drawn above; the verdict tree
// (paper Figure 2, template/decision_tree_v3.svg) has no fallback - without it the float block is skipped.
const FIGS = {fig1: () => (D.figures && D.figures.fig1_svg) || figConcept(),
              tree: () => (D.figures && D.figures.tree_svg) || ''};

// -- paper float blocks (collapsible; the reader can look at the float while listening) --
function floatBlock(blk){
  const d = document.createElement('details');
  d.className = 'pfloat';
  d.open = blk.open !== false;
  const kind = blk.kind === 'table' ? 'table' : 'figure';
  d.innerHTML = `<summary><span class="cv"></span><span class="fchip sm">${esc(blk.label || '')}</span>` +
    `<span class="ft">${esc(blk.title || '')}</span><span class="pt">paper ${kind}</span></summary>`;
  const body = document.createElement('div');
  body.className = 'pbody ' + (kind === 'table' ? 'ptabs' : 'pfig');
  const figKey = blk.figure || '';
  const fig = (figKey && FIGS[figKey]) ? FIGS[figKey]() : '';
  if (fig) body.innerHTML = fig;
  else if (blk.html) body.innerHTML = kind === 'table' ? '<div class="ptw">' + blk.html + '</div>' : blk.html;
  else return null;
  if (blk.caption) body.insertAdjacentHTML('beforeend', `<div class="pcap">${blk.caption}</div>`);
  d.appendChild(body);
  return d;
}

// -- cards --
// Six-detector score strip: the same six detectors as paper Figure 3 (same names, same thresholds), for this
// one example. c.detectors = [{det, name, value, cut, flagged, distance}] in the order cards.json gives them
// (the audit's order; the figure lays the same six out as a 2x3 grid); absent -> nothing is drawn.
const DOT = '\u25CF';                                     // the non-colour "this detector fired" cue
const dnum = v => { const x = Number(v); return Math.abs(x) >= 100 ? x.toFixed(1) : x.toFixed(3); };
// c.moves = [{metric, statement, expect, cells:[{system, base, swap, delta}]}] - what the swap did to the
// measurements the paper's Table 2 reports. 'expect' is the paper's hypothesis for this row.
function moveTable(c){
  const rows = (c.moves || []).filter(r => r && r.statement && (r.cells || []).length);
  if (!rows.length) return '';
  const EXP = {up: 'should rise', down: 'should fall', flat: 'should stay put'};
  const ok = (d, e) => e === 'up' ? d >= 0.05 : e === 'down' ? d <= -0.05 : Math.abs(d) < 0.1;
  let h = '<div class="mvs"><table class="mtab"><thead><tr><th>What the swap should do</th>' +
    '<th class="n">Before &rarr; after</th></tr></thead><tbody>';
  rows.forEach(r => {
    const cells = r.cells.map(x => {
      const d = Number(x.delta), good = ok(d, r.expect);
      return `<div><span class="sysn">${esc(x.system)}</span> ${esc(Number(x.base).toFixed(2))}` +
        `<span class="ar">&rarr;</span>${esc(Number(x.swap).toFixed(2))} ` +
        `<span class="dl ${good ? 'good' : 'meh'}">${d >= 0 ? '+' : ''}${esc(d.toFixed(2))}</span></div>`;
    }).join('');
    h += `<tr><td><span class="mm">${esc(r.metric)}</span>${esc(r.statement)} ` +
      `<span class="sysn">(${esc(EXP[r.expect] || '')})</span></td><td class="n">${cells}</td></tr>`;
  });
  h += '</tbody></table><div class="mleg">MFCC is a timbre similarity, chroma a harmony correlation; ' +
    'both run from &minus;1 to 1. Before = the generation from the original conditioning, after = the ' +
    'regeneration once the marked input was replaced.</div></div>';
  return h;
}
function detStrip(c){
  const ds = (c.detectors || []).filter(d => d && d.name && isFinite(Number(d.value)) && isFinite(Number(d.cut)));
  if (!ds.length) return '';
  const cells = ds.map(d => {
    const on = !!d.flagged, op = d.distance ? '\u2264' : '\u2265';
    const tip = `${d.name} ${dnum(d.value)}, threshold ${op} ${dnum(d.cut)} (${d.distance ? 'distance' : 'similarity'}): ` +
      (on ? 'fired' : 'did not fire');
    return `<div class="dcell${on ? ' hit' : ''}" title="${esc(tip)}">` +
      `<span class="dn"><span class="dm">${on ? DOT : ''}</span>${esc(d.name)}</span>` +
      `<span class="dv">${dnum(d.value)}</span><span class="dc">${op} ${dnum(d.cut)}</span></div>`;
  }).join('');
  const nm = a => a.map(d => esc(d.name)).join(' / ');
  const fired = ds.filter(d => d.flagged), dist = ds.filter(d => d.distance), sim = ds.filter(d => !d.distance);
  let leg = fired.length ? `<b>Fired: ${fired.map(d => esc(d.name)).join(', ')}</b> (${fired.length} of ${ds.length}, marked ${DOT}).`
                         : `<b>No detector fired</b> (0 of ${ds.length}).`;
  if (dist.length) leg += ` Distance detectors ${nm(dist)} fire when the value is at or below the threshold` +
    (sim.length ? `; ${nm(sim)} when it is at or above.` : '.');
  else if (sim.length) leg += ` ${nm(sim)} fire when the value is at or above the threshold.`;
  return `<div class="dstrip" role="group" aria-label="detector scores">` +
    `<div class="dslab">Detector scores <span>the six detectors of Figure 3, for this example</span></div>` +
    `<div class="dgrid">${cells}</div><div class="dleg">${leg}</div></div>`;
}
function cardHead(c){
  // The chip is the paper-float identifier of the card (T2.3); it falls back to the raw card id.
  // A memorization example also prints its verdict case (Figure 2 / Table 3) next to that identifier.
  let h = `<div class="head"><span class="fid">${esc(c.label || c.id)}</span>` +
    (c.case ? `<span class="ccase">${esc(c.case)}</span>` : '') + `<span class="i">${esc(c.title)}</span>`;
  if (c.sub) h += `<span class="s">${esc(c.sub)}</span>`;
  h += `</div>`;
  if (c.badges && c.badges.length){
    // 1-3 badges: pills. 4+ (the score rows of Table 1) become a compact two-column key/value list.
    h += `<div class="badges${c.badges.length >= 4 ? ' kv' : ''}">` + c.badges.map(b => `<span class="badge"><span class="bl">${esc(b.label)}</span>` +
      (b.value === undefined || b.value === null || b.value === '' ? '' : `<span class="bv">${esc(b.value)}</span>`) + '</span>').join('') + '</div>';
  }
  if (c.note) h += `<div class="note">${c.note}</div>`;
  h += detStrip(c);
  h += moveTable(c);
  return h;
}
function buildCard(c){
  const card = document.createElement('div'); card.className = 'card'; card.id = 'card-' + esc(c.id);
  card.innerHTML = cardHead(c);
  (c.groups || []).forEach(g => {
    const rows = (g.rows || []).filter(r => Array.isArray(r.clip) && r.clip.length >= 3);
    if (!rows.length) return;
    const gd = document.createElement('div'); gd.className = 'group';
    if (g.label){ const gl = document.createElement('div'); gl.className = 'glab'; gl.textContent = g.label; gd.appendChild(gl); }
    const grid = document.createElement('div'); grid.className = 'grid';
    rows.forEach(r => grid.appendChild(audioRow(r)));
    gd.appendChild(grid); card.appendChild(gd);
  });
  return card;
}
// Figure-shaped player, used by both the any-stem cards (prompt per stem) and the quality cards
// (one stem, ours / ACE / real): conditioning on the left, generated stems and the mix on the right.
function buildGenCard(c){
  const rows = {};
  const stems = [];
  (c.groups || []).forEach(g => (g.rows || []).forEach(r => {
    if (!Array.isArray(r.clip) || r.clip.length < 3) return;
    const k = r.key || '';
    rows[k] = r;
    if (k.indexOf('p_') === 0){
      const st = k.slice(2);
      stems.push({g: st, label: slug(g.label) === st ? g.label : titleize(st)});
    }
  }));
  const ctx = rows.ctx;
  if (!ctx || !stems.length) return buildCard(c);
  const one = stems.length === 1;
  // ours / ACE / real of one stem: keyed <sys>_<stem>, or plain <sys> when the card has a single stem.
  const pick = g => { const o = {}; ['ours', 'ace', 'real'].forEach(s => {
    const r = rows[s + '_' + g] || (one ? rows[s] : null); if (r) o[s] = r; }); return o; };
  const card = document.createElement('div'); card.className = 'card'; card.id = 'card-' + esc(c.id);
  card.innerHTML = cardHead(c);
  const fig = document.createElement('div'); fig.className = 'genfig';
  const left = document.createElement('div'); left.className = 'gpanel left';
  left.innerHTML = '<div class="ptitle">Registered audio</div>';
  const mid = document.createElement('div'); mid.className = 'gmid';
  mid.innerHTML = '<div class="gbr"><span class="h"></span></div>';
  const right = document.createElement('div'); right.className = 'gpanel right';
  right.innerHTML = `<div class="ptitle">Generated stem${one ? '' : 's'}</div>`;
  stems.forEach((st, i) => {
    left.appendChild(genRow(st.label, stemPaint(i), {prompt: rows['p_' + st.g]}, '', 'prompt'));
    const o = pick(st.g);
    if (Object.keys(o).length) right.appendChild(genRow(st.label, stemPaint(i), o));
  });
  left.insertAdjacentHTML('beforeend', '<div class="pspace"></div>');
  left.appendChild(genRow('Context', CTX_PAINT, {ctx: ctx}, '', 'given'));
  right.insertAdjacentHTML('beforeend', '<div class="pspace"></div>');
  const mo = {}; ['ours', 'ace', 'real'].forEach(s => { if (rows['mix_' + s]) mo[s] = rows['mix_' + s]; });
  if (Object.keys(mo).length) right.appendChild(genRow(one ? 'Full mix' : 'One mix', MIX_PAINT, mo, 'mix'));
  fig.appendChild(left); fig.appendChild(mid); fig.appendChild(right);
  card.appendChild(fig);
  return card;
}
function buildBody(sec, card){
  const layout = sec.layout || LAYOUT_AT[sec.id] || 'list';
  WCOL = [];
  const node = layout === 'figure' ? buildGenCard(card) : buildCard(card);
  node.waves = WCOL;
  WCOL = null;
  return node;
}

// -- example switcher: one card body per section, chips carry the paper identifiers --
const SEC = {};   // section id -> {sec, host, chips, idx, nodes}
function swapIn(host, node){
  while (host.firstChild) host.removeChild(host.firstChild);
  host.appendChild(node);
}
function setHash(h){
  // Linkable and reload-safe; replaceState does not scroll and does not grow the history.
  try { history.replaceState(null, '', '#' + h); } catch (e) {}
}
function selectExample(sid, idx, opts){
  const st = SEC[sid];
  opts = opts || {};
  if (!st || !st.sec.cards || !st.sec.cards[idx]) return;
  if (st.idx !== idx){
    stopAll();                                   // never leave an example playing behind the reader
    st.chips.forEach((b, i) => { const on = i === idx;
      b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; });
    let node = st.nodes.get(idx);
    if (!node){ node = buildBody(st.sec, st.sec.cards[idx]); st.nodes.set(idx, node); }
    swapIn(st.host, node);
    st.idx = idx;
    // Two-level switcher: show only the chips of the active block and mark the block button.
    const blk = st.sec.cards[idx].block || null;
    if (blk){
      st.chips.forEach(b => { b.hidden = !!b.dataset.b && b.dataset.b !== blk; });
      if (st.blocks) st.blocks.querySelectorAll('.blk').forEach(t => t.classList.toggle('on', t.dataset.b === blk));
    }
    requestAnimationFrame(() => (node.waves || []).forEach(w => drawWave(w[0], w[1])));
  }
  if (opts.focus && st.chips[idx]) st.chips[idx].focus({preventScroll: true});
  if (opts.hash !== false) setHash(sid + '-' + (st.sec.cards[idx].label || st.sec.cards[idx].id));
}
// sec.cases = [{case, count, cards, note}] -> the audit's case coverage, drawn under the Table 3 block.
// The cases with count 0 are a result of the audit ("none found"), so their rows are printed, not hidden.
function caseTable(sec){
  const rows = (sec.cases || []).filter(r => r && r.case);
  if (!rows.length) return null;
  const num = r => Number(r.count), all = rows.every(r => isFinite(num(r)));
  const tot = all ? rows.reduce((a, r) => a + num(r), 0) : null;
  let h = `<div class="ct">Case coverage of the audit</div><div class="csub">One row per verdict case of Figure 2: ` +
    `how many stems the human audit put in it` + (tot !== null ? ` out of the ${tot} judged` : '') +
    `, and the examples on this page that demonstrate it.</div>`;
  h += '<table class="ctab"><thead><tr><th>Verdict case</th><th class="n">Stems</th>' +
    '<th>Examples on this page</th></tr></thead><tbody>';
  rows.forEach(r => {
    // A count of 0 is a finding of the audit ("none found"); a missing count is only an unknown.
    const n = num(r), has = isFinite(n), zero = has && n <= 0, ids = (r.cards || []).map(String).filter(Boolean);
    h += `<tr${zero ? ' class="z"' : ''}><td><span class="cs">${esc(r.case)}</span>` +
      (r.note ? `<span class="cn">${esc(r.note)}</span>` : '') + '</td>' +
      `<td class="n">${has ? esc(n) : '&ndash;'}</td><td>` +
      (ids.length ? ids.map(x => `<a class="xl" href="#${esc(sec.id)}-${encodeURIComponent(x)}" data-ex="${esc(x)}">${esc(x)}</a>`).join('')
                  : `<span class="nf">${zero ? 'none found in the audit' : 'no example on this page'}</span>`) +
      '</td></tr>';
  });
  const wrap = document.createElement('div');
  wrap.className = 'ccov';
  wrap.innerHTML = h + '</tbody></table>';
  wrap.querySelectorAll('a.xl').forEach(a => a.onclick = ev => {
    if (gotoExample(sec.id, a.dataset.ex)) ev.preventDefault();   // no link if the switcher is not up yet
  });
  return wrap;
}
function buildSwitcher(sec){
  const wrap = document.createElement('div');
  wrap.className = 'sws'; wrap.setAttribute('role', 'tablist'); wrap.setAttribute('aria-label', 'examples');
  const cards = sec.cards || [], chips = [], grouped = (sec.floats || []).length > 1;
  // Two levels when the cards carry a block (the a / b / c blocks of the paper's Table 2): pick the block
  // first, then the example inside it. Blocks keep the order in which they first appear.
  const blocks = [];
  cards.forEach(c => { if (c.block && !blocks.some(b => b.key === c.block)) blocks.push({key: c.block, title: c.block_title || ''}); });
  let blockBar = null;
  if (blocks.length > 1){
    blockBar = document.createElement('div');
    blockBar.className = 'blks';
    blocks.forEach(bk => {
      const t = document.createElement('button');
      t.type = 'button'; t.className = 'blk'; t.dataset.b = bk.key;
      t.innerHTML = `<span class="bk">${esc(bk.key)}</span><span class="bt">${esc(bk.title)}</span>`;
      t.onclick = () => {
        const st = SEC[sec.id];
        const j = cards.findIndex(c => c.block === bk.key);
        if (j >= 0) selectExample(sec.id, j, {focus: true});
      };
      blockBar.appendChild(t);
    });
    wrap.appendChild(blockBar);
  }
  let prev = null, first = true;
  cards.forEach((c, i) => {
    if (grouped && !blocks.length && c.float && c.float !== prev){
      const g = document.createElement('span');
      g.className = 'swg' + (first ? ' first' : '');
      g.textContent = c.float + (c.float_title ? ' \u00b7 ' + c.float_title : '');
      wrap.appendChild(g); first = false;
    }
    prev = c.float;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (i === 0 ? ' on' : '');
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    b.setAttribute('aria-controls', 'ex-' + sec.id);
    b.tabIndex = i === 0 ? 0 : -1;
    b.title = (c.float ? c.float + ' \u00b7 ' : '') + (c.case ? c.case + ' \u00b7 ' : '') + (c.title || '');
    b.innerHTML = `<span class="cid">${esc(c.label || c.id)}</span>` +
      (c.case ? `<span class="ccase">${esc(c.case)}</span>` : '') +
      (c.hint ? `<span class="chint">${esc(c.hint)}</span>` : '');
    b.onclick = () => selectExample(sec.id, i, {focus: true});
    if (c.block) b.dataset.b = c.block;
    chips.push(b); wrap.appendChild(b);
  });
  wrap.addEventListener('keydown', ev => {
    const k = ev.key;
    if (k !== 'ArrowLeft' && k !== 'ArrowRight' && k !== 'Home' && k !== 'End') return;
    const st = SEC[sec.id];
    if (!st || !st.chips.length) return;
    ev.preventDefault(); ev.stopPropagation();        // arrows move between examples, not the playhead
    const cur = st.sec.cards[st.idx < 0 ? 0 : st.idx];
    const blk = cur && cur.block;
    const idxs = st.sec.cards.map((c, j) => j).filter(j => !blk || st.sec.cards[j].block === blk);
    const at = Math.max(0, idxs.indexOf(st.idx < 0 ? idxs[0] : st.idx)), n = idxs.length;
    let i;
    if (k === 'Home') i = idxs[0];
    else if (k === 'End') i = idxs[n - 1];
    else i = idxs[(at + (k === 'ArrowLeft' ? -1 : 1) + n) % n];
    selectExample(sec.id, i, {focus: true});
  });
  return {wrap: wrap, chips: chips, blocks: blockBar};
}

// -- page --
function buildSection(sec){
  const s = document.createElement('section'); s.id = sec.id;
  // Heading = the paper-float identifiers of the section (e.g. "Figure 2 + Table 3 + Figure 3") and its title.
  const hd = document.createElement('div'); hd.className = 'shead';
  if (sec.float){ const ch = document.createElement('span'); ch.className = 'fchip'; ch.textContent = sec.float; hd.appendChild(ch); }
  const h = document.createElement('h2'); h.textContent = sec.title || sec.float_title || ''; hd.appendChild(h);
  s.appendChild(hd);
  if (sec.intro_html){ const d = document.createElement('div'); d.className = 'intro'; d.innerHTML = sec.intro_html; s.appendChild(d); }
  let blocks = sec.floats || [];
  if (!blocks.length){
    const fk = sec.figure || FIG_AT[sec.id];
    if (fk && FIGS[fk]) blocks = [{label: sec.float, title: sec.float_title, kind: 'figure', figure: fk, caption: sec.figure_caption}];
  }
  const cases = caseTable(sec);                    // null unless the section carries sec.cases
  let placed = false;
  blocks.forEach(b => {
    const el = floatBlock(b);
    if (el) s.appendChild(el);
    // The coverage table is the reading of the audit table (Table 3), so it sits right under that block.
    if (el && cases && !placed && (b.key === 't3' || /table\s*3/i.test(b.label || ''))){ s.appendChild(cases); placed = true; }
  });
  if (cases && !placed) s.appendChild(cases);      // no audit table on the page: keep the result visible
  if ((sec.cards || []).length){
    const sw = buildSwitcher(sec);
    s.appendChild(sw.wrap);
    const host = document.createElement('div'); host.className = 'exhost'; host.id = 'ex-' + sec.id;
    host.setAttribute('role', 'tabpanel'); host.setAttribute('aria-label', 'selected example');
    s.appendChild(host);
    SEC[sec.id] = {sec: sec, host: host, chips: sw.chips, blocks: sw.blocks, idx: -1, nodes: new Map()};
  }
  return s;
}
function findExample(sid, label){
  // Index of the example whose paper identifier (T3.3) or card id (t3_3) matches, else -1.
  const st = SEC[sid], lab = String(label == null ? '' : label).toLowerCase();
  if (!st || !lab) return -1;
  const cards = st.sec.cards || [];
  let idx = -1;
  cards.forEach((c, i) => { if (idx < 0 && (String(c.label || '').toLowerCase() === lab || String(c.id || '').toLowerCase() === lab)) idx = i; });
  return idx;
}
function gotoExample(sid, label){
  const idx = findExample(sid, label);
  if (idx < 0) return false;
  selectExample(sid, idx, {focus: true});
  return true;
}
function applyHash(scroll){
  // '#<section>-<identifier>', e.g. '#mem-T3.3'; a plain '#<section>' is left to the browser anchor.
  const h = decodeURIComponent(String(location.hash || '').replace(/^#/, ''));
  const m = /^([A-Za-z0-9]+)-(.+)$/.exec(h);
  if (!m) return false;
  const idx = findExample(m[1], m[2]);
  if (idx < 0) return false;
  selectExample(m[1], idx, {hash: false});
  if (scroll){ const el = document.getElementById(m[1]); if (el) el.scrollIntoView(); }
  return true;
}
function render(){
  document.title = D.title || 'Audio examples';
  document.getElementById('brand').textContent = D.short_title || 'Audio examples';
  document.getElementById('pageTitle').textContent = D.title || '';
  const au = document.getElementById('authors');
  if (D.profile === 'named' && D.authors && D.authors.length){
    const affs = []; D.authors.forEach(a => { if (a.affiliation && !affs.includes(a.affiliation)) affs.push(a.affiliation); });
    au.innerHTML = D.authors.map(a => `${esc(a.name)}<sup>${affs.indexOf(a.affiliation) + 1}</sup>`).join(', ') +
      '<br><span class="muted">' + affs.map((x, i) => `<sup>${i + 1}</sup>${esc(x)}`).join(' &nbsp; ') + '</span>';
  } else au.textContent = 'Anonymous authors';
  document.getElementById('subtitle').innerHTML = D.subtitle || '';
  document.getElementById('overview').innerHTML = D.overview_html || '';
  const nav = document.getElementById('navLinks'); nav.innerHTML = '';
  const main = document.getElementById('main'); main.innerHTML = '';
  (D.sections || []).forEach(sec => {
    // Nav carries the short float identifiers: Fig 1, T1, T2, Fig 2 + T3 + Fig 3, Notes.
    const a = document.createElement('a'); a.className = 'lnk'; a.href = '#' + sec.id;
    a.textContent = sec.short || sec.float || sec.title;
    a.title = sec.float ? sec.float + ' \u00b7 ' + (sec.title || '') : (sec.title || '');
    nav.appendChild(a);
    main.appendChild(buildSection(sec));
  });
  document.getElementById('foot').innerHTML = D.footer_html || '';
  Object.keys(SEC).forEach(sid => selectExample(sid, 0, {hash: false}));   // first example of every section
  applyHash(true);
  window.addEventListener('hashchange', () => applyHash(true));
  // highlight the section in view
  if ('IntersectionObserver' in window){
    const links = Array.from(nav.querySelectorAll('a.lnk'));
    const io = new IntersectionObserver(es => {
      es.forEach(en => { if (en.isIntersecting) links.forEach(l => l.classList.toggle('on', l.getAttribute('href') === '#' + en.target.id)); });
    }, {rootMargin: '-40% 0px -55% 0px'});
    main.querySelectorAll('section').forEach(s => io.observe(s));
  }
}
fetch('data.json', {cache: 'no-cache'}).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => { D = d; render(); })
  .catch(e => { const el = document.getElementById('loadMsg');
    if (el) el.textContent = 'Could not load data.json (' + e + '). Serve this folder over HTTP.'; });

// -- keys --
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const k = e.key;
  if (k === ' '){ e.preventDefault(); stopAll(); return; }
  if (k === 'Escape'){ stopAll(); return; }
  if ((k === 'ArrowLeft' || k === 'ArrowRight') && current && current.pos){
    e.preventDefault();
    const p = Math.min(Math.max(0, current.pos() + (k === 'ArrowLeft' ? -1 : 1)), current.dur - 0.05);
    playRow(...current.args, p); return;
  }
});
</script>
